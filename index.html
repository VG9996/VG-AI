<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VG AI</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #222;
    }

    #chat {
      height: calc(100vh - 150px);
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 80%;
    }

    .user {
      background: #222;
      margin-left: auto;
    }

    .ai {
      background: #111;
      border: 1px solid #222;
    }

    .input {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      background: #000;
      padding: 10px;
      box-sizing: border-box;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 25px;
      border: 1px solid #333;
      background: #111;
      color: white;
      outline: none;
    }

    button {
      margin-left: 8px;
      padding: 12px 18px;
      border: 0;
      border-radius: 25px;
      background: white;
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>VG AI 🤖</header>

<div id="chat">
  <div class="message ai">
    Hello! Main VG AI hoon. Mujhse kuch bhi poochho.
  </div>
</div>

<div class="input">
  <input id="message" placeholder="VG AI se kuch poochho...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  const chat = document.getElementById("chat");
y
  chat.innerHTML += `
    <div class="message user">${text}</div>
  `;

  input.value = "";

  chat.innerHTML += `
    <div class="message ai">
      VG AI: Abhi AI connection setup karna baaki hai. 🚀
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
