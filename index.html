<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}
  
  
header{
  height:65px;
display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #292929;
  font-size:23px;
  font-weight:bold;
  background:#101014;
}

#chat{
  height:calc(100vh - 135px);
  overflow-y:auto;
  padding:18px;
  padding-bottom:30px;
}

.message{
  max-width:88%;
  padding:13px 16px;
  margin:12px 0;
  border-radius:18px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.ai{
  background:#19191f;
  border:1px solid #303038;
  margin-right:auto;
}

.user{
  background:#fff;
  color:#000;
  margin-left:auto;
}

.typing{
  color:#aaa;
  font-style:italic;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px;
  background:#0b0b0f;
  border-top:1px solid #292929;
}

.input-area{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:auto;
}

#message{
  flex:1;
  min-width:0;
  padding:14px 17px;
  border:1px solid #383840;
  border-radius:28px;
  background:#17171c;
  color:white;
  outline:none;
  font-size:16px;
}

#message:focus{
  border-color:#777;
}

#send{
  border:0;
  border-radius:28px;
  padding:0 20px;
  background:#fff;
  color:#000;
  font-weight:bold;
}

#clear{
  display:block;
  margin:7px auto 0;
  border:0;
  background:transparent;
  color:#888;
  font-size:12px;
}
</style>
</head>

<body>

<header><img src="icon-192.png" alt="AI Logo" style="width:45px;height:45px;margin-right:10px;"><span>VG AI</span></header><div id="chat">
  <div class="message ai">
    Hello! 👋

    Main VG AI hoon.
    Mujhse kuch bhi poochho. 🤖
  </div>
</div>

<div class="bottom">
  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="VG AI se kuch poochho..."
      autocomplete="off"
    >
    <button id="send">Send</button>
  </div>

  <button id="clear">Clear chat</button>
</div>

<script>
const input=document.getElementById("message");
const send=document.getElementById("send");
const chat=document.getElementById("chat");
const clear=document.getElementById("clear");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function getReply(text){
  const msg=text.toLowerCase();

  if(msg.includes("hello")||msg.includes("hi")||msg.includes("hey")){
    return "Hello! 👋 Main VG AI hoon. Kaise help karun?";
  }

  if(msg.includes("naam")){
    return "Mera naam VG AI hai. 🤖";
  }

  if(msg.includes("kaise ho")){
    return "Main bilkul ready hoon! 😎 Tum kya poochna chahte ho?";
  }

  if(msg.includes("who are you")||msg.includes("tum kon")){
    return "Main VG AI hoon — tumhari personal AI website. 🤖";
  }

  if(msg.includes("help")){
    return "Bilkul! 😊 Tum mujhse questions, ideas, coding aur general information ke baare me pooch sakte ho.";
  }

  if(msg.includes("time")){
    return "Main exact current time dekhne ke liye abhi internet se connected nahi hoon. ⏰";
  }

  if(msg.includes("thank")){
    return "You're welcome! 😊";
  }

  if(msg.includes("coding")||msg.includes("code")){
    return "Coding ke liye apna problem bhejo. 💻 Main explanation aur code example dene ki koshish karunga.";
  }

  if(msg.includes("joke")){
    return "Teacher: Homework kahan hai?\nStudent: Sir, homework bhi online tha... network nahi tha! 😂";
  }

  if(msg.includes("good morning")){
    return "Good morning! ☀️ Aaj VG AI me kuch naya banate hain!";
  }

  if(msg.includes("good night")){
    return "Good night! 🌙 Kal phir milte hain. 🤖";
  }

  return "Interesting question! 🤔\n\nTumne poocha:\n"+text+
  "\n\nMain abhi demo AI mode me hoon. Real online AI connection add karne par VG AI actual AI answers de sakta hai. 🚀";
}

function sendMessage(){
  const text=input.value.trim();

  if(!text)return;

  addMessage(text,"user");
  input.value="";
  input.focus();

  const typing=document.createElement("div");
  typing.className="message ai typing";
  typing.textContent="VG AI is thinking...";
  chat.appendChild(typing);
  chat.scrollTop=chat.scrollHeight;

  setTimeout(()=>{
    typing.remove();
    addMessage(getReply(text),"ai");
  },700);
}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",(event)=>{
  if(event.key==="Enter"){
    event.preventDefault();
    sendMessage();
  }
});

clear.addEventListener("click",()=>{
  chat.innerHTML="";
  addMessage(
    "Chat clear ho gaya! 👋\n\nMain VG AI hoon. Kuch poochho.",
    "ai"
  );
});
</script>

</body>
</html>
