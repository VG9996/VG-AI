<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VG AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 25px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    #chat {
      height: calc(100vh - 140px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.4;
    }

    .ai {
      background: #181818;
      border: 1px solid #333;
    }

    .user {
      background: #333;
      margin-left: auto;
    }

    .input-box {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #000;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 25px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      background: white;
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>🤖 VG AI</header>

<div id="chat">
  <div class="message ai">
    Hello!
