<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VG AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #29292f;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      height: calc(100vh - 135px);
      overflow-y: auto;
      padding: 18px;
      padding-bottom: 30px;
    }

    .message {
      max-width: 88%;
      padding: 14px 16px;
      margin: 12px 0;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai {
      background: #19191f;
      border: 1px solid #303038;
      margin-right: auto;
    }

    .user {
      background: white;
      color: black;
      margin-left: auto;
    }

    .typing {
      color: #aaa;
      font-style: italic;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px;
      background: #09090d;
      border-top: 1px solid #29292f;
    }

    .input-area {
      display: flex;
      gap: 8px;
      max-width: 900px;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 16px;
      border-radius: 30px;
      border: 1px solid #444;
      background: #19191f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 25px;
      border: none;
      border-radius: 30px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
    }

    button:active {
      transform: scale(.96);
    }

    .clear {
      display: block;
      margin: 8px auto 0;
      background: transparent;
      color: #888;
      font-size: 13px;
      padding: 4px 10px;
    }
  </style>
</head>

<body>

<header>🤖 VG AI</header>

<div id="chat">

  <div class="message ai">
    Hello! 👋<br><br>
    Main VG AI hoon.<br>
    Mujhse kuch bhi poochho. 🤖
  </div>

</div>

<div class="bottom">

  <div class="input-area">
    <input
      id="input"
      type="text"
      placeholder="VG AI se kuch poochho..."
      autocomplete="off"
    >

    <button id="send">Send</button>
  </div>

  <button class="clear" id="clear">Clear chat</button>

</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const clear = document.getElementById("clear");

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";
    input.focus();

    const typing = addMessage("VG AI soch raha hai... 🤔", "ai typing");

    try {

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      });

      const data = await response.json();

      typing.remove();

      if (data.reply) {
        addMessage(data.reply, "ai");
      } else {
        addMessage("Sorry, AI se response nahi mila. 😕", "ai");
      }

    } catch (error) {

      typing.remove();

      addMessage(
        "AI server se connection nahi ho pa raha. Thodi der baad try karo. 🔄",
        "ai"
      );

    }
  }

  send.addEventListener("click", sendMessage);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });

  clear.addEventListener("click", function() {
    chat.innerHTML = `
      <div class="message ai">
        Chat clear ho gaya! 👋<br><br>
        Main VG AI hoon. Kuch poochho. 🤖
      </div>
    `;
  });
</script>

</body>
</html>
